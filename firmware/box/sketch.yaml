# arduino-cli build profile for the box sketch.
# Usage:  arduino-cli compile --profile box firmware/box
#         arduino-cli upload  --profile box -p COM5 firmware/box
# Versions mirror firmware/README.md (starter program, tested 2026-10-15).
profiles:
  box:
    fqbn: esp32:esp32:esp32
    platforms:
      - platform: esp32:esp32 (3.3.1)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ESP Async WebServer (3.9.2)
      - Async TCP (3.4.9)
      - Adafruit BNO055 (1.6.4)
      - Adafruit Unified Sensor (1.1.15)
      - Adafruit SSD1306 (2.5.16)
      - Adafruit GFX Library (1.12.4)
      - Adafruit BusIO (1.17.4)
      - TinyGPSPlus-ESP32 (0.0.2)

default_profile: box
